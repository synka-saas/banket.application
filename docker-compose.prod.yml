# Produção (VPS) com deploy blue-green: docker compose -f docker-compose.prod.yml ...
# - Duas cópias do app (blue/green) em 127.0.0.1, atrás do Nginx do host; só uma recebe tráfego
#   (upstream em /etc/nginx/conf.d/banket-upstream.conf, trocado por scripts/deploy-remoto.sh)
# - Postgres sem porta publicada (acessível só pela rede interna do compose)
name: banket

x-webapp: &webapp
  build: .
  restart: unless-stopped
  environment:
    # Papel da aplicação (sem superuser, sujeito a RLS)
    - DATABASE_URL=postgres://${APP_DB_USER:-banket_app}:${APP_DB_PASSWORD:-banket_app_pass}@postgres:5432/${POSTGRES_DB:-banket_db}
    # Dono das tabelas: usado só em migrations e fluxos de sistema (login, cadastro, convites)
    - DATABASE_URL_SYSTEM=postgres://${POSTGRES_USER:-banket_user}:${POSTGRES_PASSWORD:-banket_pass}@postgres:5432/${POSTGRES_DB:-banket_db}
    - APP_DB_USER=${APP_DB_USER:-banket_app}
    - APP_DB_PASSWORD=${APP_DB_PASSWORD:-banket_app_pass}
    - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
    - APP_URL=${APP_URL:-http://localhost:4321}
    - BUSCA_URL=${BUSCA_URL:-}
    - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    # Equipe Banket: e-mails (separados por vírgula) que veem /equipe/reivindicacoes e recebem os pedidos do Busca
    - BANKET_EQUIPE_EMAILS=${BANKET_EQUIPE_EMAILS:-}
    - RESEND_API_KEY=${RESEND_API_KEY:-}
    - MAIL_FROM=${MAIL_FROM:-Banket <nao-responda@banket.com.br>}
    - RESEND_INBOUND_DOMAIN=${RESEND_INBOUND_DOMAIN:-}
    - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
    - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:-}
    - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
    - WHATSAPP_WABA_ID=${WHATSAPP_WABA_ID:-}
    - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
    - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
    - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-}
    - BUSCA_RANKING_PESOS=${BUSCA_RANKING_PESOS:-}
    - BUSCA_RANKING_REGRAS=${BUSCA_RANKING_REGRAS:-}
    - STRIPE_AMBIENTE=${STRIPE_AMBIENTE:-dev}
    - STRIPE_SECRET_KEY_DEV=${STRIPE_SECRET_KEY_DEV:-}
    - STRIPE_WEBHOOK_SECRET_DEV=${STRIPE_WEBHOOK_SECRET_DEV:-}
    - STRIPE_SECRET_KEY_PROD=${STRIPE_SECRET_KEY_PROD:-}
    - STRIPE_WEBHOOK_SECRET_PROD=${STRIPE_WEBHOOK_SECRET_PROD:-}
    - STRIPE_API_VERSION=${STRIPE_API_VERSION:-}
    - STRIPE_PIX_EXPIRES_SECONDS=${STRIPE_PIX_EXPIRES_SECONDS:-}
    - OPENAI_TOKEN=${OPENAI_TOKEN:-}
    - OPENAI_MODEL=${OPENAI_MODEL:-}
    - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-}
    - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    - UPLOAD_DIR=/data/uploads
    # Integração com o Manager Hwesta (HCP, ver INTEGRACAO_HWESTA.md); sem as chaves, a integração fica desligada
    - HWESTA_APP_ID=banket
    - HWESTA_MANAGER_URL=${HWESTA_MANAGER_URL:-http://hwesta_manager:4329}
    - HWESTA_APP_KEY=${HWESTA_APP_KEY:-}
    - HWESTA_MANAGER_KEY=${HWESTA_MANAGER_KEY:-}
  volumes:
    - uploads_data:/data/uploads
  # default: Postgres do próprio compose; hwesta_net: rede compartilhada onde o Manager alcança http://banket:4321
  # (blue e green usam o mesmo alias; o Postgres fica só na rede default)
  networks:
    default:
    hwesta_net:
      aliases: [banket]
  depends_on:
    postgres:
      condition: service_healthy

services:
  webapp_blue:
    <<: *webapp
    ports:
      - "127.0.0.1:${APP_PORT_BLUE:-5168}:4321"

  webapp_green:
    <<: *webapp
    ports:
      - "127.0.0.1:${APP_PORT_GREEN:-5169}:4321"

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-banket_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-banket_pass}
      - POSTGRES_DB=${POSTGRES_DB:-banket_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-banket_user} -d $${POSTGRES_DB:-banket_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:

networks:
  hwesta_net:
    name: hwesta_external_net
    external: true
