<!-- @dsCard group="Colors" viewport="700x110" name="Feedback" subtitle="success · warning · danger · info — text on tinted bg" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.f{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid}.d{width:8px;height:8px;border-radius:50%;background:currentColor}</style></head><body>
<div class="g"><div class="f" style="background:var(--success-bg);color:var(--success);border-color:var(--success-border)"><span class="d"></span>Proposta aprovada</div><div class="f" style="background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)"><span class="d"></span>Sem retorno há 7 dias</div><div class="f" style="background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)"><span class="d"></span>Falha ao gerar PDF</div><div class="f" style="background:var(--info-bg);color:var(--info);border-color:var(--info-border)"><span class="d"></span>Proposta enviada</div></div>
</body></html>
