<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.p{border-radius:12px;padding:16px;height:128px;display:flex;flex-direction:column;gap:10px}.l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#888}</style></head><body>
<div class="g">
<div class="p" style="background:#F7F7F7;border:1px solid #E2E2E2;font-family:'Open Sans',Arial,sans-serif"><div class="l">Antes</div><div style="font-weight:700;font-size:18px;color:#333">Funil de vendas</div><div style="display:flex;gap:8px"><span style="background:#C74229;color:#fff;font-weight:600;font-size:12px;padding:8px 12px;border-radius:3px">NOVO EVENTO</span><span style="border:1px solid #333;color:#333;font-weight:600;font-size:12px;padding:7px 12px;border-radius:3px">FILTROS</span><span style="background:#fff0eb;color:#7d1d09;font-size:10px;padding:4px 6px;border-radius:2px;align-self:center">SOCIAL</span></div></div>
<div class="p" style="background:var(--bg-app);border:1px solid var(--border-default)"><div class="l" style="color:var(--text-muted)">Depois</div><div style="font-weight:500;font-size:19px;letter-spacing:-.01em;color:var(--text-strong)">Funil de vendas</div><div style="display:flex;gap:8px;align-items:center"><span style="background:var(--action-primary);color:#fff;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px">Novo evento</span><span style="background:#fff;border:1px solid var(--border-strong);color:var(--text-heading);font-weight:500;font-size:13px;padding:8px 14px;border-radius:8px">Filtros</span><span style="background:var(--bg-subtle);color:var(--text-body);font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px">Social</span></div></div>
</div></body></html>
