<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="g"><div class="c"><div class="b" style="background:var(--stage-new)"></div><div class="t">Novo orçamento<span>--stage-new · clay-400</span></div></div><div class="c"><div class="b" style="background:var(--stage-negotiation)"></div><div class="t">Em negociação<span>--stage-negotiation · terracotta-500</span></div></div><div class="c"><div class="b" style="background:var(--stage-won)"></div><div class="t">Aprovado<span>--stage-won · sage-500</span></div></div><div class="c"><div class="b" style="background:var(--stage-lost)"></div><div class="t">Recusado<span>--stage-lost · clay-800</span></div></div></div>
</body></html>
