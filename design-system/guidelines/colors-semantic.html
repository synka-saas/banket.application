<!-- @dsCard group="Colors" viewport="700x200" name="Semantic surfaces & text" subtitle="App bg, surface, sidebar, text roles, borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:#fff;font-size:12px}.g{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s{height:62px;border-radius:10px;border:1px solid var(--border-default);display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}.t div{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}.t code{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}.b{display:flex;gap:8px;margin-top:10px}.b span{flex:1;height:22px;border-radius:6px;background:#fff}</style></head><body>
<div class="g"><div><div class="sw"><div class="s" style="background:var(--bg-app)">bg-app</div><div class="s" style="background:var(--bg-surface)">surface</div><div class="s" style="background:var(--bg-sidebar)">sidebar</div><div class="s" style="background:var(--bg-subtle)">subtle</div></div>
<div class="b"><span style="border:1px solid var(--border-subtle)"></span><span style="border:1px solid var(--border-default)"></span><span style="border:1px solid var(--border-strong)"></span><span style="border:1px solid var(--border-focus);box-shadow:var(--focus-ring)"></span></div></div>
<div class="t"><div style="color:var(--text-strong)">Strong <code>--text-strong</code></div><div style="color:var(--text-heading)">Heading <code>--text-heading</code></div><div style="color:var(--text-body)">Body <code>--text-body</code></div><div style="color:var(--text-secondary)">Secondary <code>--text-secondary</code></div><div style="color:var(--text-muted)">Muted <code>--text-muted</code></div><div style="color:var(--text-link)">Link / accent <code>--text-link</code></div></div></div>
</body></html>
