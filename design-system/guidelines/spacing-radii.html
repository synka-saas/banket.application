<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Softened corners echo the app-icon tile" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:#fff}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.b{height:72px;background:var(--bg-accent-subtle);border:1.5px solid var(--terracotta-300)}.m{font-size:11px;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono)}.m b{display:block;font-family:var(--font-sans);font-weight:500;color:var(--text-heading);font-size:12px}</style></head><body>
<div class="g"><div><div class="b" style="border-radius:var(--radius-xs)"></div><div class="m"><b>xs 4</b>checkbox, chip</div></div><div><div class="b" style="border-radius:var(--radius-sm)"></div><div class="m"><b>sm 6</b>tag, sm button</div></div><div><div class="b" style="border-radius:var(--radius-md)"></div><div class="m"><b>md 8</b>button, input</div></div><div><div class="b" style="border-radius:var(--radius-lg)"></div><div class="m"><b>lg 12</b>card, table</div></div><div><div class="b" style="border-radius:var(--radius-xl)"></div><div class="m"><b>xl 16</b>empty-state tile</div></div><div><div class="b" style="border-radius:var(--radius-full)"></div><div class="m"><b>full</b>badge, switch</div></div></div>
</body></html>
