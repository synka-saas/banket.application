# Central de Ajuda do Banket (app.banket.com.br/ajuda/).
#
# Projeto Compose próprio ("banket-help"), separado do compose da raiz (projeto "banket"): subir ou recriar a ajuda
# nunca mexe no app nem no Postgres. Não precisa de variável de ambiente nem de banco: é só arquivo estático.
#   docker compose up -d --build        (rodar em help/)
# ou, da raiz: make help-deploy (ou help/scripts/deploy.sh). Ver help/DEPLOY.md.

name: banket-help

services:
  banket-help:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${HELP_BUILD_ID:-dev}
    image: banket-help:latest
    container_name: banket-help
    restart: unless-stopped
    ports:
      # Só local: o Nginx do host faz o proxy de app.banket.com.br/ajuda/ para cá, depois do auth_request.
      - "127.0.0.1:5175:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
