    # ---------- Central de Ajuda (help/, contêiner banket-help em 127.0.0.1:5175) ----------
    # Tudo em /ajuda/ exige sessão do app: auth_request em /api/ajuda/sessao (200 = entra, 401 = login, 403 = suspensa).
    # Fonte versionada: /var/www/banket/help/nginx/host-app.banket.com.br.locations.conf (ver help/DEPLOY.md).
    location = /ajuda {
        return 301 /ajuda/;
    }

    location /ajuda/ {
        auth_request /_ajuda_sessao;
        error_page 401 = @ajuda_login;
        error_page 403 = @ajuda_suspensa;

        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # O contêiner só serve arquivos: não precisa (nem deve receber) o cookie de sessão.
        proxy_set_header Cookie "";
    }

    location = /_ajuda_sessao {
        internal;
        proxy_pass http://banket_app/api/ajuda/sessao;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache banket_ajuda_sessao;
        proxy_cache_key "$cookie_banket_sessao|$cookie_banket_session";
        proxy_cache_valid 200 30s;
        proxy_cache_valid any 0;
        proxy_no_cache $banket_ajuda_sem_cookie;
        proxy_cache_bypass $banket_ajuda_sem_cookie;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
    }

    # Sem sessão: login do app, que volta para a página pedida (?next= só aceita caminho interno: destinoInterno).
    # no-store: a Cloudflare não pode guardar este redirect (senão quem já entrou continuaria sendo mandado ao login).
    location @ajuda_login {
        add_header Cache-Control "no-store" always;
        return 302 /auth/login?next=$uri;
    }

    location @ajuda_suspensa {
        add_header Cache-Control "no-store" always;
        return 302 /conta-suspensa;
    }

