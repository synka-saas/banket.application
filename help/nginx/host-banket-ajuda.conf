# /etc/nginx/conf.d/banket-ajuda.conf — contexto http, usado pelo server de app.banket.com.br.
# Fonte versionada: /var/www/banket/help/nginx/host-banket-ajuda.conf (ver help/DEPLOY.md).

# Cache do "sim" da verificação de sessão (30 s por cookie): imagens e índice de busca não chamam o app um a um.
proxy_cache_path /var/cache/nginx/banket_ajuda levels=1 keys_zone=banket_ajuda_sessao:1m max_size=10m inactive=2m use_temp_path=off;

# Sem cookie de sessão não há o que guardar em cache.
map "$cookie_banket_sessao$cookie_banket_session" $banket_ajuda_sem_cookie {
    ""      1;
    default 0;
}
