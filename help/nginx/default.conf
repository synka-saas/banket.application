# nginx do contêiner banket-help — serve help/site/dist em /ajuda/.
#
# Este contêiner NÃO confere sessão: ele só publica em 127.0.0.1:5175 e quem protege é o Nginx do host
# (app.banket.com.br), com auth_request em /api/ajuda/sessao do app antes de repassar qualquer requisição para cá.
# Ver help/DEPLOY.md e help/nginx/host-app.banket.com.br.conf.
#
# Cache: tudo sai como "private" (a Cloudflare e outros caches compartilhados não guardam conteúdo protegido);
# HTML e índice de busca sem cache; arquivos com hash no nome, cache longo só no navegador.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain image/svg+xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;

    # Healthcheck do contêiner
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ajuda {
        return 301 /ajuda/;
    }

    location /ajuda/ {
        error_page 404 /ajuda/404.html;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/index.html =404;

        # CSS, JS e imagens otimizadas do Astro (nome com hash)
        location ^~ /ajuda/_astro/ {
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ^~ /ajuda/fonts/ {
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Índice de busca: muda a cada build (pagefind.js e pagefind-entry.json sem hash)
        location ^~ /ajuda/pagefind/ {
            add_header Cache-Control "private, no-cache" always;
            types {
                application/javascript js;
                application/json       json;
                application/wasm       wasm;
                text/css               css;
            }
            default_type application/octet-stream;
            try_files $uri =404;
        }
    }

    location = /ajuda/404.html {
        add_header Cache-Control "private, no-cache" always;
        internal;
    }

    # Fora de /ajuda/ não há nada.
    location / {
        return 404;
    }
}
