# nginx do container yosp_help — serve help/site/dist em /ajuda/.
#
# Acesso:
#   público   → /ajuda/ (home), /ajuda/entrar/, fontes, favicon e o CSS/JS do site (_astro/*.css|js);
#   protegido → todo o resto (categorias, artigos, imagens, índice do Pagefind, 404):
#               cada requisição passa por auth_request no serviço help-auth.
# Sem sessão, a página protegida responde 401 com a tela de login no corpo (a URL
# não muda; depois de entrar, a tela recarrega a mesma página).
#
# Cache: conteúdo protegido sai sempre como "private" (a Cloudflare e outros
# caches compartilhados não guardam); só o que é público pode ser "public".

proxy_cache_path /var/cache/nginx/help_auth levels=1 keys_zone=help_auth:1m max_size=10m inactive=2m use_temp_path=off;

# Sem cookie de sessão não há o que guardar em cache.
map $cookie_auth_token $help_no_token {
    ""      1;
    default 0;
}

upstream help_auth {
    server yosp_help_auth:3000;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain image/svg+xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Healthcheck do container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- Verificação de sessão (subrequest) ----------
    location = /_auth {
        internal;
        proxy_pass http://help_auth/check;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;

        # O access token (JWT) tem validade fixa; repetir a checagem a cada imagem
        # é desperdício. Guarda só o "sim" por 30 s, por token.
        proxy_cache help_auth;
        proxy_cache_key $cookie_auth_token;
        proxy_cache_valid 200 30s;
        proxy_cache_valid any 0;
        proxy_no_cache $help_no_token;
        proxy_cache_bypass $help_no_token;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
    }

    # ---------- Público ----------
    location = /ajuda {
        return 301 /ajuda/;
    }

    location = /ajuda/ {
        add_header Cache-Control "no-cache" always;
        try_files /ajuda/index.html =404;
    }

    location ^~ /ajuda/entrar/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/index.html /ajuda/entrar/index.html;
    }

    location ^~ /ajuda/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /ajuda/favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # A tela de login pergunta se já existe sessão (200/401, sem corpo).
    location = /ajuda/_sessao {
        auth_request /_auth;
        error_page 401 = @unauthorized;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        try_files /sessao.txt =404;
    }

    location @unauthorized {
        add_header Cache-Control "no-store" always;
        return 401;
    }

    # ---------- Protegido ----------
    location /ajuda/ {
        auth_request /_auth;
        # Sem "=": mantém o status 401 e entrega a tela de login no corpo.
        error_page 401 /ajuda/entrar/index.html;
        error_page 404 /ajuda/404.html;

        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/index.html =404;

        # CSS e JS do site (nomes com hash) são públicos: a home e a tela de login usam.
        # Fica aninhado aqui porque o nginx testa os regex aninhados antes dos de fora.
        location ~ ^/ajuda/_astro/[^/]+\.(css|js)$ {
            auth_request off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Imagens otimizadas (nomes com hash) são conteúdo: cache longo, só no navegador.
        location ~ ^/ajuda/_astro/ {
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Índice de busca: muda a cada deploy (pagefind.js e pagefind-entry.json sem hash).
        location ^~ /ajuda/pagefind/ {
            add_header Cache-Control "private, no-cache" always;
            types {
                application/javascript js;
                application/json       json;
                application/wasm       wasm;
                text/css               css;
            }
            default_type application/octet-stream;
            try_files $uri =404;
        }
    }

    location = /ajuda/404.html {
        auth_request /_auth;
        error_page 401 /ajuda/entrar/index.html;
        add_header Cache-Control "private, no-cache" always;
        internal;
    }

    # Fora de /ajuda/ não há nada.
    location / {
        return 404;
    }
}
