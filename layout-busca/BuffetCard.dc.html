<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/styles.css">
  <script src="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<article style="position:relative;display:flex;flex-wrap:wrap;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-xs);font-family:var(--font-sans);height:100%" style-hover="box-shadow:var(--shadow-md);border-color:var(--border-strong)">
  <div style="position:relative;flex:1 1 280px;min-height:{{ photoH }};background:var(--clay-100);color:var(--clay-500)">
    <image-slot id="{{ slotId }}" shape="rect" placeholder="{{ buffet.photo }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot>
    <sc-if value="{{ buffet.available }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--sage-700);font-size:12px;font-weight:500;box-shadow:var(--shadow-sm);pointer-events:none">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--sage-500)"></span>Disponível na data
      </span>
    </sc-if>
  </div>
  <div style="flex:999 1 300px;display:flex;flex-direction:column;gap:12px;padding:16px 18px 18px;min-width:0">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <a href="#" onClick="{{ open }}" style="font-size:17px;line-height:1.3;font-weight:500;color:var(--text-strong);letter-spacing:-.01em">{{ buffet.name }}</a>
        <sc-if value="{{ buffet.banket }}" hint-placeholder-val="{{ false }}">
          <span title="Usa o Banket para gerenciar eventos e orçamentos" style="flex:none;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 4px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--border-default);font-size:11px;font-weight:500;color:var(--text-secondary);white-space:nowrap">
            <x-import component-from-global-scope="BanketDesignSystem_f9651f.Logo" variant="mark" height="{{ 14 }}" hint-size="14px,14px"></x-import>Gestão Banket
          </span>
        </sc-if>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:13px;color:var(--text-secondary)">
        <span style="display:inline-flex;align-items:center;gap:4px;color:var(--text-strong);font-weight:500">
          <span style="display:inline-flex;color:var(--ochre-500)"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="star" size="{{ 14 }}" fill="currentColor" hint-size="14px,14px"></x-import></span>{{ buffet.rating }}
          <span style="font-weight:400;color:var(--text-muted)">({{ buffet.reviews }})</span>
        </span>
        <span style="color:var(--clay-300)">·</span>
        <span>{{ buffet.area }}</span>
        <sc-if value="{{ buffet.dist }}" hint-placeholder-val="{{ false }}"><span style="color:var(--clay-300)">·</span><span>{{ buffet.dist }}</span></sc-if>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <sc-for list="{{ tags }}" as="t" hint-placeholder-count="3">
        <x-import component-from-global-scope="BanketDesignSystem_f9651f.Tag" size="sm" hint-size="80px,20px">{{ t }}</x-import>
      </sc-for>
    </div>
    <div style="margin-top:auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;padding-top:12px;border-top:1px solid var(--border-subtle)">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:12px;color:var(--text-muted)">a partir de</span>
        <span style="display:flex;align-items:baseline;gap:4px"><span style="font-size:20px;font-weight:500;letter-spacing:-.02em;color:var(--text-strong);font-variant-numeric:tabular-nums">{{ buffet.price }}</span><span style="font-size:13px;color:var(--text-secondary)">por pessoa</span></span>
        <span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="users" size="{{ 14 }}" hint-size="14px,14px"></x-import>{{ capText }}</span>
      </div>
      <sc-if value="{{ showActions }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <sc-if value="{{ selectable }}" hint-placeholder-val="{{ true }}">
            <x-import component-from-global-scope="BanketDesignSystem_f9651f.Checkbox" label="Selecionar" checked="{{ selected }}" onChange="{{ toggle }}" hint-size="96px,20px"></x-import>
          </sc-if>
          <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="primary" onClick="{{ quote }}" hint-size="140px,40px">Pedir orçamento</x-import>
        </div>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ selected }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:-1px;border:2px solid var(--terracotta-500);border-radius:16px;pointer-events:none"></div>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:300},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selectable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;buffet&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;slot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const b = p.buffet || { id: "x", name: "Buffet Sabor de Festa", rating: "4,9", reviews: 128, area: "Santo André, SP", dist: "2,4 km", price: "R$ 89", min: 40, max: 250, tags: ["Buffet completo", "Espaço próprio", "Vegetariano"], available: true, banket: true, photo: "Foto do salão ou da mesa posta" };
    const compact = !!p.compact;
    return {
      buffet: b,
      tags: compact ? b.tags.slice(0, 2) : b.tags,
      capText: b.min + " a " + b.max + " convidados",
      slotId: "card-" + (p.slot || "x") + "-" + b.id,
      photoH: compact ? "180px" : "220px",
      showActions: !compact,
      selectable: p.selectable ?? true,
      selected: !!p.selected,
      toggle: () => p.onToggle && p.onToggle(b.id),
      quote: () => p.onQuote && p.onQuote(b.id),
      open: (e) => { e && e.preventDefault(); p.onOpen && p.onOpen(b.id); }
    };
  }
}
</script>
</body>
</html>
