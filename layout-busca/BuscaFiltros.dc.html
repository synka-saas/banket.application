<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/styles.css">
  <script src="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;font-family:var(--font-sans)">
  <div style="display:flex;flex-direction:column;gap:12px;padding:0 0 18px;border-bottom:1px solid var(--border-subtle)">
    <span style="font-size:14px;font-weight:500;color:var(--text-heading)">Preço por pessoa</span>
    <div style="position:relative;height:18px;margin:0 9px">
      <div style="position:absolute;left:0;right:0;top:7px;height:4px;border-radius:4px;background:var(--clay-150)"></div>
      <div style="position:absolute;left:12%;right:42%;top:7px;height:4px;border-radius:4px;background:var(--terracotta-500)"></div>
      <span style="position:absolute;left:12%;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:2px solid var(--terracotta-500);box-shadow:var(--shadow-sm)"></span>
      <span style="position:absolute;left:58%;top:0;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:2px solid var(--terracotta-500);box-shadow:var(--shadow-sm)"></span>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px">
      <x-import component-from-global-scope="BanketDesignSystem_f9651f.TextInput" size="sm" prefix="R$" defaultValue="60" hint-size="100%,32px"></x-import>
      <span style="color:var(--text-muted)">–</span>
      <x-import component-from-global-scope="BanketDesignSystem_f9651f.TextInput" size="sm" prefix="R$" defaultValue="150" hint-size="100%,32px"></x-import>
    </div>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--border-subtle)">
      <span style="font-size:14px;font-weight:500;color:var(--text-heading)">{{ g.title }}</span>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <x-import component-from-global-scope="BanketDesignSystem_f9651f.Checkbox" label="{{ it.label }}" checked="{{ it.on }}" onChange="{{ it.toggle }}" hint-size="140px,20px"></x-import>
          <span style="font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums">{{ it.n }}</span>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <div style="display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--border-subtle)">
    <span style="font-size:14px;font-weight:500;color:var(--text-heading)">Avaliação mínima</span>
    <x-import component-from-global-scope="BanketDesignSystem_f9651f.SegmentedControl" options="{{ ratingOpts }}" value="{{ rating }}" onChange="{{ setRating }}" block="{{ true }}" hint-size="100%,38px"></x-import>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;padding:18px 0 0">
    <span style="font-size:14px;font-weight:500;color:var(--text-heading)">Distância</span>
    <x-import component-from-global-scope="BanketDesignSystem_f9651f.Select" options="{{ distOpts }}" defaultValue="Até 10 km" icon="map-pin" hint-size="100%,40px"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:900},&quot;kosher&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { on: { "Buffet completo": 1, "Espaço próprio do buffet": 1, "Vegetariano": 1, ...(this.props.kosher ? { Kosher: 1 } : {}) }, rating: "4+" };
  renderVals() {
    const on = this.state.on;
    const mk = (title, rows) => ({ title, items: rows.map(([label, n]) => ({ label, n, on: !!on[label], toggle: () => this.setState(s => ({ on: { ...s.on, [label]: !s.on[label] } })) })) });
    return {
      groups: [
        mk("Tipo de serviço", [["Buffet completo", 14], ["Finger food", 6], ["Churrasco", 3], ["Doces e bolos", 5], ["Bebidas e bartender", 4]]),
        mk("Capacidade", [["Até 50 convidados", 9], ["50 a 100 convidados", 18], ["100 a 200 convidados", 15], ["Mais de 200 convidados", 7]]),
        mk("Atendimento", [["Espaço próprio do buffet", 16], ["Em domicílio", 11]]),
        mk("Opções de cardápio", [["Vegetariano", 19], ["Vegano", 8], ["Sem glúten", 10], ["Kosher", 1]])
      ],
      ratingOpts: ["Todas", "4+", "4,5+"],
      rating: this.state.rating,
      setRating: (v) => this.setState({ rating: v }),
      distOpts: ["Até 5 km", "Até 10 km", "Até 25 km", "Até 50 km"]
    };
  }
}
</script>
</body>
</html>
