<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/styles.css">
  <script src="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/_ds_bundle.js"></script>
</helmet>
<header style="display:flex;align-items:center;gap:28px;height:68px;padding:0 clamp(16px, 4.4cqw, 64px);background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);font-family:var(--font-sans)">
  <a href="#" style="display:flex;align-items:center;gap:8px;text-decoration:none;flex:none">
    <x-import component-from-global-scope="BanketDesignSystem_f9651f.Logo" height="{{ 26 }}" hint-size="99px,26px"></x-import>
    <span style="display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--terracotta-500);color:#fff;font-size:13px;font-weight:500;letter-spacing:.01em;line-height:1;margin-top:3px">busca</span>
  </a>
  <div style="flex:1"></div>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <nav style="display:flex;align-items:center;gap:28px">
      <a href="#como-funciona" style="font-size:14px;font-weight:500;color:var(--text-heading)">Como funciona</a>
      <a href="#para-buffets" style="font-size:14px;font-weight:500;color:var(--text-heading)">Para buffets</a>
      <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="secondary" size="sm" icon="user" hint-size="84px,32px">Entrar</x-import>
    </nav>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:4px">
      <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="ghost" size="sm" hint-size="64px,32px">Entrar</x-import>
      <x-import component-from-global-scope="BanketDesignSystem_f9651f.IconButton" icon="menu-2" label="Menu" hint-size="40px,40px"></x-import>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:80},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.device === "mobile";
    return { isMobile: m, isDesktop: !m };
  }
}
</script>
</body>
</html>
