<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/styles.css">
  <script src="_ds/banket-design-system-f9651ff1-0b9d-4125-bad2-8f9a17b73c11/_ds_bundle.js"></script>
  <style>a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</helmet>
<div data-screen-label="Resultados" style="position:relative;container-type:inline-size;height:100%;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-body);overflow:hidden">
  <div style="height:100%;overflow-y:auto">
    <dc-import name="BuscaHeader" device="{{ device }}" hint-size="100%,68px"></dc-import>
    <div style="padding:14px clamp(16px, 4.4cqw, 64px);background:var(--bg-surface);border-bottom:1px solid var(--border-default)">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:stretch;max-width:920px;height:60px;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden">
          <sc-for list="{{ summary }}" as="s" hint-placeholder-count="4">
            <button style="flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px;padding:0 18px;border:0;border-right:1px solid var(--border-subtle);background:transparent;text-align:left;cursor:pointer" style-hover="background:var(--clay-25)">
              <span style="display:inline-flex;color:var(--text-muted)"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="{{ s.icon }}" size="{{ 18 }}" hint-size="18px,18px"></x-import></span>
              <span style="display:flex;flex-direction:column;min-width:0;line-height:1.3"><span style="font-size:12px;color:var(--text-muted)">{{ s.label }}</span><span style="font-size:14px;font-weight:500;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.value }}</span></span>
            </button>
          </sc-for>
          <div style="display:flex;align-items:center;padding:0 10px"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="primary" icon="search" hint-size="110px,40px">Atualizar</x-import></div>
        </div>
      </sc-if>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <button style="display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 14px;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-sm);text-align:left;cursor:pointer">
          <span style="display:inline-flex;color:var(--text-muted)"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="search" size="{{ 18 }}" hint-size="18px,18px"></x-import></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35"><span style="font-size:14px;font-weight:500;color:var(--text-strong)">{{ mTitle }}</span><span style="font-size:12px;color:var(--text-muted)">{{ mMeta }}</span></span>
          <span style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--bg-subtle);color:var(--text-heading)"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="pencil" size="{{ 16 }}" hint-size="16px,16px"></x-import></span>
        </button>
      </sc-if>
    </div>

    <div style="display:flex;gap:28px;align-items:flex-start;padding:24px clamp(16px, 4.4cqw, 64px) 40px">
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <aside style="flex:0 0 272px;position:sticky;top:16px;padding:18px 20px 20px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-xs)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><span style="font-size:15px;font-weight:500;color:var(--text-strong)">Filtros</span><x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="text" tone="accent" size="sm" hint-size="50px,24px">Limpar</x-import></div>
          <dc-import name="BuscaFiltros" kosher="{{ empty }}" hint-size="100%,860px"></dc-import>
        </aside>
      </sc-if>
      <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px">
          <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
            <h1 style="font-size:clamp(19px, 1.6cqw, 22px);letter-spacing:-.01em;color:var(--text-strong)">{{ countTitle }}</h1>
            <p style="font-size:13px;color:var(--text-secondary)">{{ countMeta }}</p>
          </div>
          <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;align-items:center;gap:10px"><span style="font-size:13px;color:var(--text-secondary)">Ordenar por</span><x-import component-from-global-scope="BanketDesignSystem_f9651f.Select" options="{{ sortOpts }}" defaultValue="Mais relevantes" style="width:190px" hint-size="190px,40px"></x-import></div>
          </sc-if>
        </div>
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:8px;align-items:center">
            <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="secondary" icon="adjustments-horizontal" onClick="{{ openFilters }}" hint-size="120px,40px">{{ filterLabel }}</x-import>
            <x-import component-from-global-scope="BanketDesignSystem_f9651f.Select" options="{{ sortOpts }}" defaultValue="Mais relevantes" icon="sort-descending-2" style="flex:1" hint-size="100%,40px"></x-import>
          </div>
        </sc-if>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
            <button style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 12px;border:0;border-radius:999px;background:var(--terracotta-50);color:var(--terracotta-800);font-size:13px;font-weight:500;cursor:pointer" style-hover="background:var(--terracotta-100)">{{ c }}<x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="x" size="{{ 14 }}" hint-size="14px,14px"></x-import></button>
          </sc-for>
        </div>
        <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:16px">
            <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
              <dc-import name="BuffetCard" buffet="{{ it.b }}" selected="{{ it.selected }}" onToggle="{{ toggle }}" onQuote="{{ quoteOne }}" slot="res-{{ ab }}" hint-size="100%,240px"></dc-import>
            </sc-for>
            <div style="display:flex;justify-content:center;padding-top:8px"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="secondary" icon="chevron-down" hint-size="200px,40px">Mostrar mais 18 buffets</x-import></div>
          </div>
        </sc-if>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;align-items:center;padding:4px clamp(16px, 2cqw, 28px) 32px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:16px">
            <x-import component-from-global-scope="BanketDesignSystem_f9651f.EmptyState" icon="search" title="Nenhum buffet encontrado para essa busca" description="Nenhum buffet de Santo André atende 300 convidados com cardápio kosher em 14/11/2026." hint-size="100%,220px"></x-import>
            <div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px">
              <span style="font-size:13px;font-weight:500;color:var(--text-heading)">Tente ampliar a busca</span>
              <sc-for list="{{ suggestions }}" as="sg" hint-placeholder-count="3">
                <button style="display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:10px;text-align:left;cursor:pointer" style-hover="border-color:var(--border-accent);background:var(--terracotta-50)">
                  <span style="display:inline-flex;color:var(--terracotta-600)"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Icon" name="{{ sg.icon }}" size="{{ 18 }}" hint-size="18px,18px"></x-import></span>
                  <span style="flex:1;font-size:14px;color:var(--text-heading)">{{ sg.t }}</span>
                  <x-import component-from-global-scope="BanketDesignSystem_f9651f.Tag" tone="sage" size="sm" hint-size="70px,20px">{{ sg.n }}</x-import>
                </button>
              </sc-for>
              <div style="display:flex;justify-content:center;margin-top:12px"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="secondary" icon="refresh" hint-size="180px,40px">Limpar todos os filtros</x-import></div>
            </div>
          </div>
        </sc-if>
      </div>
    </div>
    <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
      <div style="position:sticky;bottom:16px;z-index:20;display:flex;justify-content:center;padding:0 clamp(12px, 4.4cqw, 64px) 16px">
        <x-import component-from-global-scope="BanketDesignSystem_f9651f.ActionBar" sticky="{{ false }}" status="{{ selStatus }}" style="width:100%;max-width:760px" hint-size="100%,64px">
          <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="ghost" onClick="{{ clearSel }}" hint-size="130px,40px">Limpar seleção</x-import></sc-if>
          <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="primary" icon="send" onClick="{{ quoteAll }}" hint-size="200px,40px">{{ selCta }}</x-import>
        </x-import>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ filtersOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end">
      <div onClick="{{ closeFilters }}" style="position:absolute;inset:0;background:var(--bg-overlay);backdrop-filter:blur(2px)"></div>
      <div style="position:relative;display:flex;flex-direction:column;max-height:88%;background:var(--bg-surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-xl)">
        <div style="width:36px;height:4px;border-radius:4px;background:var(--clay-300);margin:8px auto 4px"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 12px 10px 20px;border-bottom:1px solid var(--border-default)"><span style="font-size:17px;font-weight:500;color:var(--text-strong)">Filtros</span><x-import component-from-global-scope="BanketDesignSystem_f9651f.IconButton" icon="x" label="Fechar" onClick="{{ closeFilters }}" hint-size="40px,40px"></x-import></div>
        <div style="flex:1;overflow-y:auto;padding:18px 20px"><dc-import name="BuscaFiltros" hint-size="100%,860px"></dc-import></div>
        <div style="display:flex;gap:10px;padding:12px 16px 20px;border-top:1px solid var(--border-default);background:var(--clay-25)">
          <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="secondary" hint-size="90px,48px" size="lg">Limpar</x-import>
          <x-import component-from-global-scope="BanketDesignSystem_f9651f.Button" variant="primary" size="lg" onClick="{{ closeFilters }}" style="flex:1" hint-size="100%,48px">Ver 24 buffets</x-import>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ quoteOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="BuscaOrcamento" device="{{ device }}" buffets="{{ quoteList }}" sent="{{ quoteSent }}" onClose="{{ closeQuote }}" style="position:absolute;inset:0;z-index:50" hint-size="100%,100%"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'mobile'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;selecting&quot;,&quot;empty&quot;,&quot;filters&quot;,&quot;quote&quot;,&quot;sent&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const st = p.state || "default";
    const pre = ["sabor", "pirlim", "villa"];
    this.state = {
      sel: st === "selecting" || st === "quote" || st === "sent" ? pre : [],
      filters: st === "filters",
      quote: st === "quote" || st === "sent" ? "multi" : null,
      sent: st === "sent"
    };
  }
  renderVals() {
    const dev = this.props.device || "desktop";
    const m = dev === "mobile";
    const empty = this.props.state === "empty";
    const B = [
      { id: "sabor", name: "Buffet Sabor de Festa", rating: "4,9", reviews: 128, area: "Vila Assunção, Santo André", dist: "2,4 km", price: "R$ 89", min: 40, max: 250, tags: ["Buffet completo", "Espaço próprio", "Vegetariano"], available: true, banket: true, photo: "Salão de festas infantil" },
      { id: "pirlim", name: "Espaço Pirlimpimpim Festas", rating: "4,8", reviews: 212, area: "Jardim, Santo André", dist: "3,1 km", price: "R$ 99", min: 50, max: 180, tags: ["Buffet completo", "Espaço próprio", "Sem glúten", "Monitores"], available: true, banket: true, photo: "Brinquedoteca e salão" },
      { id: "villa", name: "Villa Bistrô Catering", rating: "4,9", reviews: 61, area: "Santa Paula, São Caetano do Sul", dist: "6,8 km", price: "R$ 118", min: 20, max: 180, tags: ["Finger food", "Em domicílio", "Vegano"], available: true, banket: false, photo: "Volantes e finger food" },
      { id: "mundo", name: "Mundo Encantado Buffet", rating: "4,6", reviews: 89, area: "Centro, São Bernardo do Campo", dist: "7,5 km", price: "R$ 76", min: 60, max: 300, tags: ["Buffet completo", "Espaço próprio", "Vegetariano"], available: false, banket: true, photo: "Salão temático" },
      { id: "doce", name: "Doce Encontro Buffet & Confeitaria", rating: "4,7", reviews: 47, area: "Centro, Santo André", dist: "1,9 km", price: "R$ 65", min: 20, max: 120, tags: ["Doces e bolos", "Em domicílio", "Vegetariano"], available: true, banket: false, photo: "Mesa de doces" },
      { id: "brasa", name: "Brasa & Cia Churrasco", rating: "4,7", reviews: 203, area: "Vila Bocaina, Mauá", dist: "9,2 km", price: "R$ 72", min: 30, max: 400, tags: ["Churrasco", "Em domicílio"], available: true, banket: false, photo: "Churrasco" }
    ];
    const sel = this.state.sel;
    const names = sel.map(id => (B.find(b => b.id === id) || {}).name).filter(Boolean);
    const guests = empty ? "300" : "80";
    return {
      device: dev, ab: this.props.ab || dev, isMobile: m, isDesktop: !m, empty, hasResults: !empty,
      summary: [
        { icon: "confetti", label: "Evento", value: "Aniversário infantil" },
        { icon: "map-pin", label: "Local", value: "Santo André, SP" },
        { icon: "calendar", label: "Data", value: "14/11/2026" },
        { icon: "users", label: "Convidados", value: guests }
      ],
      mTitle: "Aniversário infantil · Santo André",
      mMeta: "14/11/2026 · " + guests + " convidados",
      countTitle: empty ? "Nenhum buffet para essa combinação" : "24 buffets para aniversário infantil",
      countMeta: empty ? "Santo André, SP · 14/11/2026 · 300 convidados" : "Santo André, SP · 14/11/2026 · 80 convidados · todos atendem a sua região",
      sortOpts: ["Mais relevantes", "Melhor avaliados", "Menor preço", "Mais próximos"],
      filterLabel: empty ? "Filtros (3)" : "Filtros (4)",
      chips: empty ? ["Kosher", "Mais de 200 convidados", "Até 10 km"] : ["R$ 60 a R$ 150 por pessoa", "Buffet completo", "Espaço próprio", "Vegetariano"],
      items: B.map(b => ({ b, selected: sel.includes(b.id) })),
      suggestions: [
        { icon: "map-pin", t: "Aumentar a distância para 25 km", n: "+3 buffets" },
        { icon: "salad", t: "Trocar kosher por vegetariano", n: "+7 buffets" },
        { icon: "calendar", t: "Ver datas próximas: 13/11 ou 15/11", n: "+2 buffets" }
      ],
      toggle: (id) => this.setState(s => ({ sel: s.sel.includes(id) ? s.sel.filter(x => x !== id) : [...s.sel, id] })),
      clearSel: () => this.setState({ sel: [] }),
      hasSel: sel.length > 0,
      selStatus: m ? sel.length + " selecionados" : sel.length + " buffets selecionados · um pedido só para todos",
      selCta: m ? "Pedir orçamento (" + sel.length + ")" : "Pedir orçamento para os " + sel.length,
      quoteAll: () => this.setState({ quote: "multi", sent: false }),
      quoteOne: (id) => this.setState({ quote: id, sent: false }),
      quoteOpen: !!this.state.quote,
      quoteList: this.state.quote === "multi" ? names : [(B.find(b => b.id === this.state.quote) || B[0]).name],
      quoteSent: this.state.sent,
      closeQuote: () => this.setState({ quote: null, sent: false }),
      filtersOpen: this.state.filters,
      openFilters: () => this.setState({ filters: true }),
      closeFilters: () => this.setState({ filters: false })
    };
  }
}
</script>
</body>
</html>
